# A release tag also publishes the @lesscap/gamma-reader package, which serves a working tree with npx.
name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the build names its version from the tag as a deployment does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gamma-reader/server --filter @gamma-reader/web build
      - run: npm pkg set version="${GITHUB_REF_NAME#v}"
        working-directory: web-packages/cli
      - run: pnpm publish --no-git-checks --access public
        working-directory: web-packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
