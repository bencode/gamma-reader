<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A parabola</title>
    <style>
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #2b2730; background: #fbf8f4; }
      h3 { margin: 0 0 10px; font-weight: 600; }
      label { display: flex; gap: 12px; align-items: center; }
      input { flex: 1; }
      svg { display: block; width: 100%; height: 170px; margin-top: 10px; background: white; border: 1px solid #e3dccf; border-radius: 6px; }
      small { color: #8a8190; }
    </style>
  </head>
  <body>
    <h3>y = a·x²</h3>
    <label>a <input id="a" type="range" min="-2" max="2" step="0.1" value="1" /> <b id="value">1.0</b></label>
    <svg viewBox="-10 -10 20 20" preserveAspectRatio="none" role="img">
      <title>The graph of y = a·x²</title>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#ddd" stroke-width="0.08" />
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#ddd" stroke-width="0.08" />
      <path id="curve" fill="none" stroke="#8f315f" stroke-width="0.18" />
    </svg>
    <small id="size"></small>
    <script>
      const draw = () => {
        const a = Number(document.getElementById('a').value)
        document.getElementById('value').textContent = a.toFixed(1)
        const points = Array.from({ length: 81 }, (_, i) => {
          const x = -10 + i / 4
          return `${x},${(-a * x * x) / 10}`
        })
        document.getElementById('curve').setAttribute('d', `M${points.join(' L')}`)
        document.getElementById('size').textContent = `This page is ${innerWidth} × ${innerHeight} pixels.`
      }
      document.getElementById('a').addEventListener('input', draw)
      addEventListener('resize', draw)
      draw()
    </script>
  </body>
</html>
