name: gamma-reader

services:
  reader:
    image: gamma-reader:${GAMMA_READER_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3302
      GLM_API_KEY: ${GLM_API_KEY:?GLM_API_KEY is required}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3}
      GLM_VISION_MODEL: ${GLM_VISION_MODEL:-glm-5.3-flash}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_LIMIT: ${RATE_LIMIT:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      RATE_LIMIT_DAILY_TOKENS_PER_IP: ${RATE_LIMIT_DAILY_TOKENS_PER_IP:-2000000}
      RATE_LIMIT_DAILY_GLOBAL_TOKENS: ${RATE_LIMIT_DAILY_GLOBAL_TOKENS:-40000000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-16384}
      MAX_STREAM_BYTES: ${MAX_STREAM_BYTES:-8388608}
    ports:
      - "172.17.0.1:3302:3302"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3302/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(error => { console.error(error); process.exit(1) })
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
