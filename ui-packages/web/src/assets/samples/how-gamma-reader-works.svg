<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">Gamma Reader local-first browser architecture</title>
  <desc id="description">Files are copied directly into IndexedDB and processed by the browser. Asking the assistant sends only the question and content needed for the answer through a stateless LLM proxy to the configured model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8f315f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#221d20" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="#fafafa"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="54" y="42" width="188" height="30" rx="15" fill="#f8eff4"/>
    <text x="73" y="63" fill="#8f315f" font-size="13" font-weight="700" letter-spacing="1">BROWSER-NATIVE</text>
    <text x="54" y="126" fill="#2b292a" font-size="40" font-weight="650">Local documents. Browser tools. One thin model proxy.</text>
    <text x="54" y="164" fill="#716c6f" font-size="18">Open a URL and start reading — no desktop application or file upload step.</text>

    <rect x="38" y="198" width="906" height="514" rx="24" fill="#ffffff" stroke="#d8d3d6" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="66" y="232" fill="#716c6f" font-size="13" font-weight="700" letter-spacing="1.4">YOUR DEVICE · BROWSER APPLICATION</text>

    <g filter="url(#shadow)">
      <rect x="70" y="272" width="222" height="212" rx="16" fill="#ffffff" stroke="#e5e1e3"/>
      <rect x="358" y="252" width="270" height="252" rx="16" fill="#ffffff" stroke="#e5e1e3"/>
      <rect x="696" y="272" width="216" height="212" rx="16" fill="#ffffff" stroke="#e5e1e3"/>
    </g>

    <g transform="translate(94 298)" fill="none" stroke="#8f315f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 0h42l18 18v64H3z"/>
      <path d="M45 0v18h18"/>
      <path d="M18 43h30M18 57h30"/>
    </g>
    <text x="94" y="405" fill="#2b292a" font-size="21" font-weight="650">Local files</text>
    <text x="94" y="435" fill="#716c6f" font-size="15">PDF · Markdown · HTML</text>
    <text x="94" y="461" fill="#716c6f" font-size="15">Images · Text</text>

    <path d="M292 378h47" fill="none" stroke="#8f315f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="297" y="359" fill="#8f315f" font-size="12" font-weight="700">LOCAL COPY</text>

    <rect x="382" y="278" width="222" height="44" rx="9" fill="#f8eff4"/>
    <g transform="translate(399 290)" fill="none" stroke="#8f315f" stroke-width="2">
      <ellipse cx="10" cy="5" rx="10" ry="5"/>
      <path d="M0 5v14c0 3 4 5 10 5s10-2 10-5V5M0 12c0 3 4 5 10 5s10-2 10-5"/>
    </g>
    <text x="435" y="307" fill="#2b292a" font-size="20" font-weight="650">IndexedDB</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="382" y="353" fill="#8f315f">files</text>
      <text x="470" y="353" fill="#716c6f">metadata</text>
      <text x="382" y="385" fill="#8f315f">contents</text>
      <text x="470" y="385" fill="#716c6f">Blob</text>
      <text x="382" y="417" fill="#8f315f">conversations</text>
      <text x="520" y="417" fill="#716c6f">state</text>
      <text x="382" y="449" fill="#8f315f">messages</text>
      <text x="470" y="449" fill="#716c6f">history</text>
    </g>
    <rect x="382" y="466" width="179" height="24" rx="12" fill="#edf7ef"/>
    <text x="395" y="483" fill="#326b3c" font-size="12" font-weight="650">Persists in this browser</text>

    <path d="M628 378h49" fill="none" stroke="#8f315f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="640" y="359" fill="#8f315f" font-size="12" font-weight="700">READ</text>

    <g transform="translate(720 299)" fill="none" stroke="#8f315f" stroke-width="3" stroke-linecap="round">
      <rect width="55" height="42" rx="5"/>
      <path d="M12 13h31M12 23h25M12 33h18"/>
      <path d="M66 10h21M66 21h21M66 32h15"/>
    </g>
    <text x="720" y="386" fill="#2b292a" font-size="21" font-weight="650">Local runtime</text>
    <text x="720" y="417" fill="#716c6f" font-size="15">Preview · PDF parsing</text>
    <text x="720" y="443" fill="#716c6f" font-size="15">Search · Read · Write</text>
    <text x="720" y="469" fill="#716c6f" font-size="15">Tabs · Agent tools</text>

    <rect x="70" y="548" width="842" height="126" rx="16" fill="#f7f7f7" stroke="#e5e1e3"/>
    <circle cx="102" cy="583" r="7" fill="#4d8b59"/>
    <text x="122" y="589" fill="#2b292a" font-size="18" font-weight="650">The document path stays inside the browser.</text>
    <text x="94" y="624" fill="#514d4f" font-size="16">Opening, previewing, parsing, and searching do not upload the file.</text>
    <text x="94" y="651" fill="#716c6f" font-size="15">Large documents skip a network transfer, so they are available as soon as the local copy is stored.</text>

    <path d="M912 378h88" fill="none" stroke="#8f315f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="930" y="342" fill="#8f315f" font-size="12" font-weight="700">QUESTION +</text>
    <text x="925" y="359" fill="#8f315f" font-size="12" font-weight="700">USED CONTENT</text>

    <g filter="url(#shadow)">
      <rect x="1018" y="252" width="326" height="198" rx="16" fill="#ffffff" stroke="#e5e1e3"/>
      <rect x="1018" y="532" width="326" height="142" rx="16" fill="#ffffff" stroke="#e5e1e3"/>
    </g>
    <text x="1048" y="291" fill="#716c6f" font-size="12" font-weight="700" letter-spacing="1.2">NODE SERVER</text>
    <text x="1048" y="333" fill="#2b292a" font-size="25" font-weight="650">LLM proxy</text>
    <text x="1048" y="369" fill="#514d4f" font-size="16">Model credentials and streaming</text>
    <line x1="1048" y1="391" x2="1314" y2="391" stroke="#e5e1e3"/>
    <text x="1048" y="420" fill="#716c6f" font-size="15">No file library · No conversation DB</text>

    <path d="M1181 450v62" fill="none" stroke="#8f315f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1199" y="487" fill="#8f315f" font-size="12" font-weight="700">PROVIDER API</text>

    <g transform="translate(1048 560)" fill="none" stroke="#8f315f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 39a25 25 0 1 1 45-17 22 22 0 1 1 8 43H17A17 17 0 0 1 18 39z"/>
      <path d="M34 45h36M34 55h26"/>
    </g>
    <text x="1144" y="583" fill="#2b292a" font-size="21" font-weight="650">Configured model</text>
    <text x="1144" y="615" fill="#716c6f" font-size="15">Receives only requests made</text>
    <text x="1144" y="640" fill="#716c6f" font-size="15">through the reading assistant</text>

    <line x1="54" y1="756" x2="1346" y2="756" stroke="#dedbdd"/>
    <text x="54" y="789" fill="#2b292a" font-size="16" font-weight="600">Privacy boundary:</text>
    <text x="202" y="789" fill="#716c6f" font-size="16">files remain local; a model request may include the question and the passages or images needed to answer it.</text>
  </g>
</svg>
